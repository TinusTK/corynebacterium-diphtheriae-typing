[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cdiph-typing"
version = "1.0.0"
description = "tox detection, tox allele and 7-gene MLST typing of Corynebacterium diphtheriae assemblies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
update = ["requests", "requests-oauthlib"]

[project.scripts]
cdiph-typing = "diphtheria_typing:main"

[tool.setuptools]
package-dir = {"" = "tool"}
py-modules = ["diphtheria_typing"]
