name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+
      - name: Unit tests (synthetic database)
        run: python -m unittest discover -s tests -v
      - name: Smoke test against bundled database
        if: hashFiles('database/mlst/profiles.tsv') != ''
        run: |
          python tool/diphtheria_typing.py -i tool/test-data/no_loci.fasta \
            -d database -o out.tsv
          cat out.tsv
          grep -q "tox not present" out.tsv

  planemo-lint:
    name: Galaxy wrapper lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install planemo
      - name: planemo lint
        run: planemo lint --fail_level warn tool/

  planemo-test:
    name: Galaxy tool test
    runs-on: ubuntu-latest
    needs: [unit, planemo-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Check database is populated
        id: db
        run: |
          if [ -f database/mlst/profiles.tsv ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT";
               echo "::notice::Skipping Galaxy tool test - database not populated yet"; fi
      - uses: actions/setup-python@v5
        if: steps.db.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Bundle tool with database
        if: steps.db.outputs.ready == 'true'
        run: |
          pip install planemo
          bash scripts/bundle_tool.sh build
      - name: planemo test
        if: steps.db.outputs.ready == 'true'
        run: |
          planemo test --test_output build/planemo_report.html \
            --test_output_json build/planemo_report.json build/cdiphtheriae_typing || {
            # Surface failure reasons as annotations (readable without log access)
            python3 -c "
          import json
          for t in json.load(open('build/planemo_report.json')).get('tests', []):
              d = t.get('data', {})
              if d.get('status') != 'success':
                  msg = ' | '.join(str(x) for x in (d.get('output_problems') or []) + [d.get('job', {}).get('stderr', '')] if x)
                  print('::error title=' + t.get('id', 'test') + '::' + msg.replace(chr(10), ' ')[:1500])
          " || true
            exit 1; }
      - uses: actions/upload-artifact@v4
        if: always() && steps.db.outputs.ready == 'true'
        with:
          name: planemo-report
          path: build/planemo_report.html
